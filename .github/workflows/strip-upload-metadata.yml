name: Strip upload metadata

on:
  push:
    branches: [main]
    paths:
      - public/images/uploads/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strip-uploads-${{ github.ref }}
  cancel-in-progress: false

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run strip-uploads
      - name: Commit stripped images
        run: |
          if git diff --quiet -- public/images/uploads; then
            echo "No metadata to strip."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/uploads
          git commit -m "chore: strip EXIF metadata from uploaded images"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed stripped images on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed (remote advanced); retrying..."
            sleep 2
          done

          echo "Could not push stripped images after 5 attempts." >&2
          exit 1