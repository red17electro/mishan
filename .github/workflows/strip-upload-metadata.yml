name: Strip upload metadata

on:
  push:
    branches: [main]
    paths:
      - public/images/uploads/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run strip-uploads
      - name: Commit stripped images
        run: |
          if git diff --quiet -- public/images/uploads; then
            echo "No metadata to strip."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/uploads
          git commit -m "chore: strip EXIF metadata from uploaded images"
          git push
