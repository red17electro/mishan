backend:
  name: git-gateway
  branch: main
  identity_url: https://mishan-kherson.netlify.app/.netlify/identity
  gateway_url: https://mishan-kherson.netlify.app/.netlify/git

local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

publish_mode: editorial_workflow

collections:
  - name: "pets"
    label: "Pets"
    label_singular: "Pet"
    folder: "src/content/pets"
    extension: "json"
    format: "json"
    create: true
    slug: "{{slug}}"
    identifier_field: "slug"
    fields:
      - { label: "Slug", name: "slug", widget: "string", hint: "Stable URL identifier. Do not change after QR codes are printed." }
      - label: "Name"
        name: "name"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Ukrainian", name: "uk", widget: "string" }
      - { label: "Species", name: "species", widget: "select", options: ["dog", "cat", "other"] }
      - { label: "Sex", name: "sex", widget: "select", options: ["female", "male", "unknown"] }
      - { label: "Age group", name: "age_group", widget: "select", options: ["baby", "young", "adult", "senior"] }
      - { label: "Age value", name: "age_value", widget: "number", value_type: "int", min: 0 }
      - { label: "Age unit", name: "age_unit", widget: "select", options: ["months", "years"] }
      - { label: "Size", name: "size", widget: "select", options: ["small", "medium", "large"] }
      - { label: "Status", name: "status", widget: "select", options: ["available", "reserved", "adopted"] }
      - label: "Location note"
        name: "location_note"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "string", default: "Kherson region" }
          - { label: "Ukrainian", name: "uk", widget: "string", default: "Херсонська область" }
      - { label: "Character tags", name: "character_tags", widget: "list", default: [] }
      - label: "Short description"
        name: "description_short"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "text" }
          - { label: "Ukrainian", name: "uk", widget: "text" }
      - label: "Full description"
        name: "description_full"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "text" }
          - { label: "Ukrainian", name: "uk", widget: "text" }
      - label: "Health"
        name: "health"
        widget: "object"
        fields:
          - { label: "Sterilized", name: "sterilized", widget: "select", options: ["yes", "no", "unknown"] }
          - { label: "Vaccinated", name: "vaccinated", widget: "select", options: ["yes", "no", "unknown"] }
          - label: "Special needs"
            name: "special_needs"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", default: "None known" }
              - { label: "Ukrainian", name: "uk", widget: "string", default: "Невідомо" }
      - label: "Compatibility"
        name: "compatibility"
        widget: "object"
        fields:
          - { label: "Children", name: "children", widget: "select", options: ["yes", "no", "unknown"] }
          - { label: "Cats", name: "cats", widget: "select", options: ["yes", "no", "unknown"] }
          - { label: "Dogs", name: "dogs", widget: "select", options: ["yes", "no", "unknown"] }
      - { label: "Photos", name: "photos", widget: "list", field: { label: "Photo", name: "photo", widget: "image" }, default: [] }
      - label: "Videos"
        name: "videos"
        widget: "list"
        required: false
        fields:
          - { label: "Type", name: "type", widget: "select", options: ["youtube", "vimeo", "external"] }
          - { label: "URL", name: "url", widget: "string" }
      - label: "Contact"
        name: "contact"
        widget: "object"
        fields:
          - { label: "Volunteer slug", name: "volunteer_slug", widget: "string", default: "placeholder-volunteer" }
      - { label: "Featured on homepage", name: "featured", widget: "boolean", default: false }
      - { label: "Created at", name: "created_at", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Updated at", name: "updated_at", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }

  - name: "volunteers"
    label: "Volunteers"
    label_singular: "Volunteer"
    folder: "src/content/volunteers"
    extension: "json"
    format: "json"
    create: true
    slug: "{{slug}}"
    identifier_field: "slug"
    fields:
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Name", name: "name", widget: "string" }
      - label: "Region"
        name: "region"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Ukrainian", name: "uk", widget: "string" }
      - { label: "Languages", name: "languages", widget: "list", default: [] }
      - label: "Role"
        name: "role"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "text" }
          - { label: "Ukrainian", name: "uk", widget: "text" }
      - label: "Contact methods"
        name: "contact_methods"
        widget: "object"
        fields:
          - { label: "WhatsApp URL", name: "whatsapp", widget: "string", required: false }
          - { label: "Telegram URL", name: "telegram", widget: "string", required: false }
          - { label: "Phone", name: "phone", widget: "string", required: false }
          - { label: "Email", name: "email", widget: "string", required: false }
      - label: "Public contact note"
        name: "public_contact_note"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Ukrainian", name: "uk", widget: "string" }
      - { label: "Show phone publicly", name: "show_phone_publicly", widget: "boolean", default: false }
